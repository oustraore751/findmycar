<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - FindMyCar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>
    <div id="header"></div>

    <main>
        <h1>Inscription</h1>

        <form id="form-inscription" novalidate>
            <label for="mail">Mail :</label>
            <input type="email" id="mail" name="mail" placeholder="Entrez votre mail"
                   autocomplete="email" required>

            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" placeholder="Entrez votre nom"
                   autocomplete="family-name" required>

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" placeholder="Entrez votre prénom"
                   autocomplete="given-name" required>

            <label for="num">Numéro de téléphone :</label>
            <input type="tel" id="num" name="num" placeholder="Entrez votre numéro de téléphone"
                   autocomplete="tel">

            <label for="mdp">Mot de passe :</label>
            <input type="password" id="mdp" name="mdp" placeholder="8 caractères minimum"
                   autocomplete="new-password" minlength="8" required>

            <label for="mdp-confirm">Confirmer le mot de passe :</label>
            <input type="password" id="mdp-confirm" name="mdp-confirm"
                   placeholder="Retapez votre mot de passe" autocomplete="new-password" required>

            <button type="submit" id="btn-inscription">S'inscrire</button>
        </form>

        <p id="message" role="alert"></p>
        <p>Déjà un compte ? <a href="login.html">Se connecter</a></p>
    </main>

    <div id="footer"></div>

    <script type="module">
        import { supabase } from './js/supabase.js';
        import './js/nav.js';
        import { afficherMessage } from './js/utils.js';

        const form = document.getElementById('form-inscription');
        const bouton = document.getElementById('btn-inscription');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = form.mail.value.trim();
            const nom = form.nom.value.trim();
            const prenom = form.prenom.value.trim();
            const telephone = form.num.value.trim();
            const motDePasse = form.mdp.value;

            // Vérifications pour aider l'utilisateur, Supabase revérifie de son côté
            if (!email || !nom || !prenom || !motDePasse) {
                afficherMessage('Merci de remplir tous les champs obligatoires.');
                return;
            }
            if (!form.mail.checkValidity()) {
                afficherMessage('Adresse mail invalide.');
                return;
            }
            if (motDePasse.length < 8) {
                afficherMessage('Le mot de passe doit faire au moins 8 caractères.');
                return;
            }
            if (motDePasse !== form['mdp-confirm'].value) {
                afficherMessage('Les mots de passe ne correspondent pas.');
                return;
            }

            bouton.disabled = true;

            // nom, prénom et téléphone partent dans les métadonnées du compte,
            // le trigger handle_new_user les recopie ensuite dans la table profiles
            const { data, error } = await supabase.auth.signUp({
                email,
                password: motDePasse,
                options: { data: { nom, prenom, telephone } }
            });

            bouton.disabled = false;

            if (error) {
                afficherMessage("Erreur lors de l'inscription : " + error.message);
                return;
            }

            // Si la confirmation par mail est activée sur Supabase, il n'y a pas
            // encore de session : l'utilisateur doit d'abord cliquer sur le lien reçu
            if (data.session) {
                location.href = 'accueil.html';
            } else {
                afficherMessage('Compte créé ! Vérifiez votre boîte mail pour confirmer votre inscription, puis connectez-vous.', false);
                form.reset();
            }
        });
    </script>
</body>
</html>
